name: Build unsigned OpenWhoop IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "Packages/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  # The unit tests existed but nothing ever ran them, so a broken assertion could sit in the repo
  # unnoticed. This job runs them on every push. It is deliberately SEPARATE from `build` and does
  # not gate it: a failing test must be visible without also cutting off the installable IPA.
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide placeholder Secrets.xcconfig
        run: cp ios/OpenWhoop/Config/Secrets.example.xcconfig ios/OpenWhoop/Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      # Pick whatever simulator the runner image actually ships instead of hard-coding a device
      # name: the available models change with every Xcode release, and a name that is not
      # installed fails the job with "Unable to find a device matching the provided destination"
      # before a single test has run.
      - name: Run unit tests
        run: |
          cd ios
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([x["udid"] for rt in d for x in d[rt] if x.get("isAvailable") and "iPhone" in x["name"]][0])')
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project OpenWhoop.xcodeproj \
            -scheme OpenWhoop \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide placeholder Secrets.xcconfig
        run: cp ios/OpenWhoop/Config/Secrets.example.xcconfig ios/OpenWhoop/Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned .app for iOS device
        run: |
          cd ios
          xcodebuild \
            -project OpenWhoop.xcodeproj \
            -scheme OpenWhoop \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa (unsigned)
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r OpenWhoop.app Payload/
          zip -r OpenWhoop-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp OpenWhoop-unsigned.ipa "$GITHUB_WORKSPACE/out/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWhoop-unsigned-ipa
          path: out/OpenWhoop-unsigned.ipa
          retention-days: 14
